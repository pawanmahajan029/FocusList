<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Tasks - Task Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="tasks-list.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <a href="dashboard.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
            <h1>All Tasks</h1>
            <p class="subtitle">View all your tasks with their completion status !!!</p>
        </header>

        <!-- Filter Section -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="statusFilter">
                    <i class="fas fa-check-circle"></i> Filter by Status
                </label>
                <select id="statusFilter" class="filter-select">
                    <option value="ALL">All Tasks</option>
                    <option value="PENDING">Pending Only</option>
                    <option value="COMPLETED">Completed Only</option>
                </select>
            </div>
        </div>

        <!-- Tasks Summary -->
        <div class="summary-cards">
            <div class="summary-card">
                <div class="summary-icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                    <i class="fas fa-tasks"></i>
                </div>
                <div class="summary-info">
                    <div class="summary-value" id="totalTasksCount">0</div>
                    <div class="summary-label">Total Tasks</div>
                </div>
            </div>

            <div class="summary-card">
                <div class="summary-icon" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="summary-info">
                    <div class="summary-value" id="completedTasksCount">0</div>
                    <div class="summary-label">Completed</div>
                </div>
            </div>

            <div class="summary-card">
                <div class="summary-icon" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="summary-info">
                    <div class="summary-value" id="pendingTasksCount">0</div>
                    <div class="summary-label">Pending</div>
                </div>
            </div>
        </div>

        <!-- Tasks List -->
        <div class="tasks-container" id="tasksContainer">
            <!-- Tasks will be dynamically inserted here -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fas fa-inbox"></i>
            <h3>No tasks found</h3>
            <p>Try adjusting your filters or add a new task</p>
            <a href="index.html" class="add-task-btn">
                <i class="fas fa-plus"></i> Add New Task
            </a>
        </div>
    </div>

    <script src="tasks-list.js"></script>
</body>

</html>
