<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker - Dashboard</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo-section">
                <i class="fas fa-layer-group"></i>
                <span>TaskFlow</span>
            </div>

            <nav class="nav-links">
                <a href="#" class="nav-item active">
                    <i class="fas fa-th-large"></i> <span>Dashboard</span>
                </a>
                <a href="add-task.html" class="nav-item">
                    <i class="fas fa-plus"></i> <span>Add Task</span>
                </a>
                <a href="tasks-list.html" class="nav-item">
                    <i class="fas fa-list"></i> <span>Task List</span>
                </a>

            </nav>

            <div class="user-profile-mini">
                <div class="avatar">U</div>
                <div class="user-info">
                    <span class="name">User</span>
                    <span class="role">Pro Member</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div>
                    <h1>Dashboard</h1>
                    <p class="subtitle">Overview of all your tasks and categories</p>
                </div>
                <div class="header-actions">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Search...">
                    </div>
                </div>
            </header>

            <!-- Time Filter Section -->
            <div class="time-filter-section">
                <div class="filter-label">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Time Period</span>
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">
                        <i class="fas fa-infinity"></i>
                        All
                    </button>
                    <button class="filter-btn" data-filter="today">
                        <i class="fas fa-calendar-day"></i>
                        Today
                    </button>
                    <button class="filter-btn" data-filter="week">
                        <i class="fas fa-calendar-week"></i>
                        This Week
                    </button>
                    <button class="filter-btn" data-filter="month">
                        <i class="fas fa-calendar"></i>
                        This Month
                    </button>
                </div>
            </div>

            <!-- Overall Progress Summary -->
            <div class="dashboard-summary">
                <div class="summary-card">
                    <div class="summary-icon"><i class="fas fa-check-circle"></i></div>
                    <div class="summary-info">
                        <div class="summary-number" id="totalCompleted">0</div>
                        <div class="summary-label">Completed Tasks</div>
                    </div>
                </div>

                <div class="summary-card">
                    <div class="summary-icon"><i class="fas fa-bullseye"></i></div>
                    <div class="summary-info">
                        <div class="summary-number" id="totalTasks">0</div>
                        <div class="summary-label">Total Tasks</div>
                    </div>
                </div>

                <div class="summary-card">
                    <div class="summary-icon"><i class="fas fa-chart-pie"></i></div>
                    <div class="summary-info">
                        <div class="summary-number" id="overallProgress">0%</div>
                        <div class="summary-label">Overall Progress</div>
                    </div>
                </div>

                <div class="summary-card">
                    <div class="summary-icon"><i class="fas fa-folder-open"></i></div>
                    <div class="summary-info">
                        <div class="summary-number" id="activeCategories">0</div>
                        <div class="summary-label">Active Categories</div>
                    </div>
                </div>
            </div>


            <!-- Categories Section -->
            <div class="categories-section">
                <h2> Categories</h2>
                <div class="categories-grid" id="categoriesGrid">
                    <!-- Category cards will be dynamically inserted here -->
                </div>
            </div>

            <!-- Filtered Tasks Section -->
            <div class="filtered-tasks-section" id="filteredTasksSection" style="display: none;">
                <h2 id="filteredTasksTitle">Filtered Tasks</h2>
                <div class="tasks-list" id="filteredTasksList">
                    <!-- Task cards will be inserted here -->
                </div>
            </div>


        </main>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
