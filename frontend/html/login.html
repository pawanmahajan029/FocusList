<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SuccessPath</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>

    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html" class="auth-logo">🚀 SuccessPath</a>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Continue your journey to consistency</p>
        </div>

        <div class="auth-card">
            <div id="errorMessage" class="message error"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="auth-btn">Sign In</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html" class="auth-link">Sign Up</a></p>
                <p style="margin-top: 10px;"><a href="index.html" class="auth-link">← Back to Home</a></p>
            </div>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>

</html>
