<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Tracker</title>
    <link rel="stylesheet" href="../css/add-task.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo-section">
                <i class="fas fa-layer-group"></i>
                <span>TaskFlow</span>
            </div>

            <nav class="nav-links">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-th-large"></i> <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item active">
                    <i class="fas fa-plus"></i> <span>Add Task</span>
                </a>
                <a href="tasks-list.html" class="nav-item">
                    <i class="fas fa-list"></i> <span>Task List</span>
                </a>
            </nav>

            <div class="user-profile-mini">
                <div class="avatar" id="userAvatar">U</div>
                <div class="user-info">
                    <span class="name" id="userName">User</span>
                </div>
                <button onclick="logout()" class="logout-icon-btn" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div>
                    <h1>Add New Task</h1>
                    <p class="subtitle">Create a new task and set your goals</p>
                </div>
            </header>

            <div class="task-input-section">
                <!-- Using a form to handle Enter key submission naturally -->
                <form id="addTaskForm" onsubmit="event.preventDefault(); addTask();">
                    <input type="text" id="taskNameInput" placeholder="Enter a new task..." class="task-input" required>

                    <div class="input-row">
                        <div class="input-group">
                            <label>Start Date</label>
                            <input type="date" id="startDateInput" class="date-input">
                        </div>

                        <div class="input-group">
                            <label>End Deadline</label>
                            <input type="date" id="endDateInput" class="date-input" required>
                        </div>

                        <div class="input-group">
                            <label>Category</label>
                            <select id="categoryInput" class="category-select">
                                <option value="WORK">Work</option>
                                <option value="LEARNING">Learning</option>
                                <option value="HEALTH">Health</option>
                                <option value="PERSONAL">Personal</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" id="addTaskBtn" class="add-task-btn">+ Add Task</button>
                </form>
            </div>
        </main>
    </div>

    <script src="../js/app.js"></script>
    <script>
        // Protect Route: Redirect to login if NO token
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
    </script>
</body>

</html>
