<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Tasks - Task Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/tasks-list.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation (Consistent with Dashboard) -->
        <aside class="sidebar">
            <div class="logo-section">
                <i class="fas fa-layer-group"></i>
                <span>TaskFlow</span>
            </div>

            <nav class="nav-links">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-th-large"></i> <span>Dashboard</span>
                </a>
                <a href="add-task.html" class="nav-item">
                    <i class="fas fa-plus"></i> <span>Add Task</span>
                </a>
                <a href="#" class="nav-item active">
                    <i class="fas fa-list"></i> <span>Task List</span>
                </a>

            </nav>

            <div class="user-profile-mini">
                <div class="avatar">U</div>
                <div class="user-info">
                    <span class="name">User</span>
                    <span class="role">Pro Member</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div>
                    <h1>All Tasks</h1>
                    <p class="subtitle">View and manage all your tasks</p>
                </div>
            </header>

            <!-- Filter Section -->
            <div class="filter-section">
                <div class="filter-group">
                    <label for="statusFilter">
                        <i class="fas fa-filter"></i> Filter by Status
                    </label>
                    <select id="statusFilter" class="filter-select">
                        <option value="ALL">All Tasks</option>
                        <option value="PENDING">Pending Only</option>
                        <option value="COMPLETED">Completed Only</option>
                    </select>
                </div>
            </div>

            <!-- Tasks Summary Cards (Re-styled) -->
            <div class="dashboard-summary">
                <div class="summary-card">
                    <div class="summary-icon"><i class="fas fa-tasks"></i></div>
                    <div class="summary-info">
                        <div class="summary-number" id="totalTasksCount">0</div>
                        <div class="summary-label">Total Tasks</div>
                    </div>
                </div>

                <div class="summary-card">
                    <div class="summary-icon"><i class="fas fa-check-circle"></i></div>
                    <div class="summary-info">
                        <div class="summary-number" id="completedTasksCount">0</div>
                        <div class="summary-label">Completed</div>
                    </div>
                </div>

                <div class="summary-card">
                    <div class="summary-icon"><i class="fas fa-clock"></i></div>
                    <div class="summary-info">
                        <div class="summary-number" id="pendingTasksCount">0</div>
                        <div class="summary-label">Pending</div>
                    </div>
                </div>
            </div>

            <!-- Tasks List -->
            <div class="tasks-grid" id="tasksContainer">
                <!-- Tasks will be dynamically inserted here -->
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="fas fa-inbox"></i>
                <h3>No tasks found</h3>
                <p>Try adjusting your filters or add a new task</p>
                <a href="add-task.html" class="add-task-btn">
                    <i class="fas fa-plus"></i> Add New Task
                </a>
            </div>
        </main>
    </div>

    <script src="../js/tasks-list.js"></script>
</body>

</html>
