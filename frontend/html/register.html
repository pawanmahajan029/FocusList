<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SuccessPath</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>

    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html" class="auth-logo">🚀 SuccessPath</a>
            <h1 class="auth-title">Start Journey</h1>
            <p class="auth-subtitle">Create your account and build habits</p>
        </div>

        <div class="auth-card">
            <div id="errorMessage" class="message error"></div>
            <div id="successMessage" class="message success"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-input" placeholder="e.g. John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Choose a username" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Min. 6 characters" required>
                </div>

                <button type="submit" class="auth-btn">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html" class="auth-link">Log In</a></p>
                <p style="margin-top: 10px;"><a href="index.html" class="auth-link">← Back to Home</a></p>
            </div>
        </div>
    </div>

    <script src="../js/register.js"></script>
</body>

</html>
