<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="header-nav">
                <a href="index.html" class="back-btn">← Dashboard</a>
                <button onclick="logout()" class="back-btn"
                    style="margin-left: 10px; border:none; background:none; cursor:pointer; color: #667eea; font-weight:600;">Logout</button>
            </div>
            <script src="auth.js"></script>
            <script>
                // Protect Route: Redirect to login if NO token
                const token = localStorage.getItem('token');
                if (!token) window.location.href = 'login.html';
            </script>
            <h1> My Task Tracker</h1>
            <p class="subtitle">Track your tasks with deadlines and achieve your goals!</p>
        </header>

        Task Input Section
        <div class="task-input-section">
            <input type="text" id="taskNameInput" placeholder="Enter a new task..." class="task-input">

            <div class="input-row">
                <div class="input-group">
                    <label>Start Date</label>
                    <input type="date" id="startDateInput" class="date-input">
                </div>

                <div class="input-group">
                    <label>End Deadline</label>
                    <input type="date" id="endDateInput" class="date-input">
                </div>

                <div class="input-group">
                    <label>Category</label>
                    <select id="categoryInput" class="category-select">
                        <option value="WORK">Work</option>
                        <option value="LEARNING">Learning</option>
                        <option value="HEALTH">Health</option>
                        <option value="PERSONAL">Personal</option>
                    </select>
                </div>
            </div>

            <button id="addTaskBtn" class="add-task-btn">+ Add Task</button>
        </div>

    </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
